<!DOCTYPE html>  <html lang="pt-BR">    <head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>PS4 Library Manager</title>    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>    
    <style>    
        * {    
            margin: 0;    
            padding: 0;    
            box-sizing: border-box;    
        }  :root {    
        --primary: #003791;    
        --primary-dark: #002560;    
        --accent: #00a8ff;    
        --bg-dark: #0a0a0a;    
        --bg-card: #1a1a1a;    
        --bg-sidebar: #111111;    
        --text: #ffffff;    
        --text-muted: #888888;    
        --border: #333333;    
        --success: #00d084;    
        --warning: #ffb800;    
        --error: #ff4757;    
    }    body {    
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;    
    background: var(--bg-dark);    
    color: var(--text);    
    min-height: 100vh;    
    overflow-x: hidden;    
}    

/* Menu Hamburguer */    
.menu-toggle {    
    position: fixed;    
    top: 20px;    
    left: 20px;    
    z-index: 1000;    
    background: var(--primary);    
    border: none;    
    color: white;    
    width: 50px;    
    height: 50px;    
    border-radius: 8px;    
    cursor: pointer;    
    font-size: 24px;    
    display: flex;    
    align-items: center;    
    justify-content: center;    
    transition: all 0.3s;    
    box-shadow: 0 4px 12px rgba(0,55,145,0.4);    
}    

.menu-toggle:hover {    
    background: var(--accent);    
    transform: scale(1.05);    
}    

/* Sidebar */    
.sidebar {    
    position: fixed;    
    left: -300px;    
    top: 0;    
    width: 300px;    
    height: 100vh;    
    background: var(--bg-sidebar);    
    border-right: 1px solid var(--border);    
    transition: left 0.3s ease;    
    z-index: 999;    
    overflow-y: auto;    
}    

.sidebar.open {    
    left: 0;    
}    

.sidebar-header {    
    padding: 30px 20px;    
    border-bottom: 1px solid var(--border);    
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));    
}    

.sidebar-header h1 {    
    font-size: 1.5rem;    
    margin-bottom: 5px;    
}    

.sidebar-header p {    
    font-size: 0.85rem;    
    opacity: 0.8;    
}    

.sidebar-menu {    
    padding: 20px 0;    
}    

.menu-item {    
    padding: 15px 25px;    
    cursor: pointer;    
    display: flex;    
    align-items: center;    
    gap: 15px;    
    transition: all 0.2s;    
    border-left: 3px solid transparent;    
}    

.menu-item:hover {    
    background: rgba(255,255,255,0.05);    
    border-left-color: var(--accent);    
}    

.menu-item.active {    
    background: rgba(0,168,255,0.1);    
    border-left-color: var(--accent);    
    color: var(--accent);    
}    

.menu-item i {    
    font-size: 1.2rem;    
    width: 24px;    
    text-align: center;    
}    

/* Overlay */    
.overlay {    
    position: fixed;    
    top: 0;    
    left: 0;    
    width: 100%;    
    height: 100%;    
    background: rgba(0,0,0,0.5);    
    opacity: 0;    
    visibility: hidden;    
    transition: all 0.3s;    
    z-index: 998;    
}    

.overlay.active {    
    opacity: 1;    
    visibility: visible;    
}    

/* Main Content */    
.main-content {    
    margin-left: 0;    
    padding: 80px 20px 40px;    
    transition: margin-left 0.3s;    
    max-width: 1400px;    
    margin: 0 auto;    
}    

/* Header */    
.header {    
    text-align: center;    
    margin-bottom: 40px;    
}    

.header h2 {    
    font-size: 2rem;    
    margin-bottom: 10px;    
    background: linear-gradient(135deg, var(--text), var(--accent));    
    -webkit-background-clip: text;    
    -webkit-text-fill-color: transparent;    
}    

/* Search Bar */    
.search-container {    
    max-width: 600px;    
    margin: 0 auto 40px;    
    position: relative;    
}    

.search-input {    
    width: 100%;    
    padding: 15px 25px;    
    padding-left: 50px;    
    background: var(--bg-card);    
    border: 1px solid var(--border);    
    border-radius: 50px;    
    color: var(--text);    
    font-size: 1rem;    
    transition: all 0.3s;    
}    

.search-input:focus {    
    outline: none;    
    border-color: var(--accent);    
    box-shadow: 0 0 20px rgba(0,168,255,0.2);    
}    

.search-icon {    
    position: absolute;    
    left: 20px;    
    top: 50%;    
    transform: translateY(-50%);    
    color: var(--text-muted);    
}    

.search-stats {    
    text-align: center;    
    margin-top: 10px;    
    color: var(--text-muted);    
    font-size: 0.9rem;    
}    

/* Games Grid */    
.games-grid {    
    display: grid;    
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));    
    gap: 25px;    
}    

.game-card {    
    background: var(--bg-card);    
    border-radius: 16px;    
    overflow: hidden;    
    border: 1px solid var(--border);    
    transition: all 0.3s;    
    cursor: pointer;    
}    

.game-card:hover {    
    transform: translateY(-5px);    
    border-color: var(--accent);    
    box-shadow: 0 10px 40px rgba(0,168,255,0.2);    
}    

.game-cover {    
    width: 100%;    
    height: 180px;    
    object-fit: cover;    
    background: linear-gradient(135deg, #1a1a1a, #2a2a2a);    
}    

.game-info {    
    padding: 20px;    
}    

.game-title {    
    font-size: 1.1rem;    
    font-weight: 600;    
    margin-bottom: 8px;    
    line-height: 1.3;    
    display: -webkit-box;    
    -webkit-line-clamp: 2;    
    -webkit-box-orient: vertical;    
    overflow: hidden;    
}    

.game-meta {    
    display: flex;    
    gap: 15px;    
    margin-bottom: 15px;    
    flex-wrap: wrap;    
}    

.meta-tag {    
    font-size: 0.75rem;    
    padding: 4px 10px;    
    background: rgba(255,255,255,0.1);    
    border-radius: 20px;    
    color: var(--text-muted);    
}    

.meta-tag.region-usa { color: #4ade80; }    
.meta-tag.region-eur { color: #60a5fa; }    
.meta-tag.region-jap { color: #f472b6; }    

.game-details {    
    border-top: 1px solid var(--border);    
    padding-top: 15px;    
}    

.detail-row {    
    display: flex;    
    justify-content: space-between;    
    margin-bottom: 8px;    
    font-size: 0.85rem;    
}    

.detail-label {    
    color: var(--text-muted);    
}    

.detail-value {    
    color: var(--text);    
    font-weight: 500;    
}    

.download-btn {    
    width: 100%;    
    margin-top: 15px;    
    padding: 12px;    
    background: var(--primary);    
    border: none;    
    border-radius: 8px;    
    color: white;    
    font-weight: 600;    
    cursor: pointer;    
    transition: all 0.3s;    
    display: flex;    
    align-items: center;    
    justify-content: center;    
    gap: 8px;    
}    

.download-btn:hover {    
    background: var(--accent);    
}    

/* Import Section */    
.import-section {    
    max-width: 800px;    
    margin: 0 auto;    
}    

.drop-zone {    
    border: 3px dashed var(--border);    
    border-radius: 20px;    
    padding: 60px 40px;    
    text-align: center;    
    transition: all 0.3s;    
    background: var(--bg-card);    
}    

.drop-zone.dragover {    
    border-color: var(--accent);    
    background: rgba(0,168,255,0.1);    
}    

.drop-zone h3 {    
    margin-bottom: 15px;    
    color: var(--text);    
}    

.drop-zone p {    
    color: var(--text-muted);    
    margin-bottom: 25px;    
}    

.file-input {    
    display: none;    
}    

.btn-primary {    
    padding: 12px 30px;    
    background: var(--primary);    
    border: none;    
    border-radius: 8px;    
    color: white;    
    font-weight: 600;    
    cursor: pointer;    
    transition: all 0.3s;    
    display: inline-flex;    
    align-items: center;    
    gap: 10px;    
}    

.btn-primary:hover {    
    background: var(--accent);    
    transform: translateY(-2px);    
}    

.imported-files {    
    margin-top: 30px;    
}    

.file-item {    
    background: var(--bg-card);    
    border: 1px solid var(--border);    
    border-radius: 12px;    
    padding: 20px;    
    margin-bottom: 15px;    
    display: flex;    
    justify-content: space-between;    
    align-items: center;    
}    

.file-info h4 {    
    margin-bottom: 5px;    
}    

.file-info p {    
    color: var(--text-muted);    
    font-size: 0.85rem;    
}    

.file-actions {    
    display: flex;    
    gap: 10px;    
}    

.btn-icon {    
    width: 40px;    
    height: 40px;    
    border-radius: 8px;    
    border: 1px solid var(--border);    
    background: transparent;    
    color: var(--text);    
    cursor: pointer;    
    transition: all 0.2s;    
    display: flex;    
    align-items: center;    
    justify-content: center;    
}    

.btn-icon:hover {    
    background: var(--error);    
    border-color: var(--error);    
}    

/* Modal */    
.modal {    
    display: none;    
    position: fixed;    
    top: 0;    
    left: 0;    
    width: 100%;    
    height: 100%;    
    background: rgba(0,0,0,0.8);    
    z-index: 2000;    
    align-items: center;    
    justify-content: center;    
    padding: 20px;    
}    

.modal.active {    
    display: flex;    
}    

.modal-content {    
    background: var(--bg-card);    
    border-radius: 20px;    
    max-width: 900px;    
    width: 100%;    
    max-height: 90vh;    
    overflow-y: auto;    
    border: 1px solid var(--border);    
}    

.modal-header {    
    padding: 25px;    
    border-bottom: 1px solid var(--border);    
    display: flex;    
    justify-content: space-between;    
    align-items: center;    
}    

.modal-header h3 {    
    font-size: 1.3rem;    
}    

.close-btn {    
    width: 40px;    
    height: 40px;    
    border-radius: 50%;    
    border: none;    
    background: var(--bg-dark);    
    color: var(--text);    
    cursor: pointer;    
    font-size: 1.2rem;    
    transition: all 0.2s;    
}    

.close-btn:hover {    
    background: var(--error);    
}    

.modal-body {    
    padding: 25px;    
}    

.game-detail-header {    
    display: flex;    
    gap: 25px;    
    margin-bottom: 30px;    
    flex-wrap: wrap;    
}    

.game-detail-cover {    
    width: 200px;    
    height: 280px;    
    object-fit: cover;    
    border-radius: 12px;    
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);    
}    

.game-detail-info h2 {    
    font-size: 1.8rem;    
    margin-bottom: 15px;    
}    

.version-tree {    
    background: var(--bg-dark);    
    border-radius: 12px;    
    padding: 20px;    
}    

.tree-item {    
    padding: 15px;    
    border-left: 3px solid var(--primary);    
    margin-left: 20px;    
    margin-bottom: 15px;    
    background: rgba(255,255,255,0.02);    
    border-radius: 0 8px 8px 0;    
    position: relative;    
}    

.tree-item::before {    
    content: '';    
    position: absolute;    
    left: -23px;    
    top: 20px;    
    width: 20px;    
    height: 3px;    
    background: var(--primary);    
}    

.tree-item.base { border-left-color: var(--success); }    
.tree-item.update { border-left-color: var(--warning); }    
.tree-item.dlc { border-left-color: var(--accent); }    

.tree-header {    
    display: flex;    
    justify-content: space-between;    
    align-items: center;    
    margin-bottom: 10px;    
}    

.tree-title {    
    font-weight: 600;    
    display: flex;    
    align-items: center;    
    gap: 10px;    
}    

.tree-type {    
    font-size: 0.75rem;    
    padding: 3px 10px;    
    border-radius: 20px;    
    text-transform: uppercase;    
    font-weight: 700;    
}    

.tree-type.base { background: rgba(0,208,132,0.2); color: var(--success); }    
.tree-type.update { background: rgba(255,184,0,0.2); color: var(--warning); }    
.tree-type.dlc { background: rgba(0,168,255,0.2); color: var(--accent); }    

.tree-meta {    
    font-size: 0.85rem;    
    color: var(--text-muted);    
    display: flex;    
    gap: 20px;    
    flex-wrap: wrap;    
}    

.tree-actions {    
    margin-top: 15px;    
    display: flex;    
    gap: 10px;    
}    

.btn-small {    
    padding: 8px 16px;    
    border-radius: 6px;    
    border: none;    
    font-size: 0.85rem;    
    cursor: pointer;    
    transition: all 0.2s;    
    display: inline-flex;    
    align-items: center;    
    gap: 6px;    
}    

.btn-download {    
    background: var(--success);    
    color: black;    
    font-weight: 600;    
}    

.btn-download:hover {    
    background: #00ff9d;    
}    

.btn-dlsp {    
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);    
    color: white;    
}    

.btn-dlsp:hover {    
    opacity: 0.9;    
}    

/* DLSP Integration Panel */    
.dlsp-panel {    
    background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));    
    border: 1px solid rgba(102,126,234,0.3);    
    border-radius: 12px;    
    padding: 20px;    
    margin-top: 20px;    
}    

.dlsp-panel h4 {    
    margin-bottom: 15px;    
    color: #a78bfa;    
}    

.dlsp-input-group {    
    display: flex;    
    gap: 10px;    
    margin-bottom: 15px;    
}    

.dlsp-input {    
    flex: 1;    
    padding: 12px;    
    background: var(--bg-dark);    
    border: 1px solid var(--border);    
    border-radius: 8px;    
    color: var(--text);    
}    

.dlsp-status {    
    padding: 10px;    
    border-radius: 8px;    
    font-size: 0.9rem;    
    display: none;    
}    

.dlsp-status.active {    
    display: block;    
}    

.dlsp-status.loading {    
    background: rgba(0,168,255,0.1);    
    color: var(--accent);    
}    

.dlsp-status.success {    
    background: rgba(0,208,132,0.1);    
    color: var(--success);    
}    

.dlsp-status.error {    
    background: rgba(255,71,87,0.1);    
    color: var(--error);    
}    

/* Toast Notifications */    
.toast-container {    
    position: fixed;    
    bottom: 20px;    
    right: 20px;    
    z-index: 3000;    
    display: flex;    
    flex-direction: column;    
    gap: 10px;    
}    

.toast {    
    padding: 15px 25px;    
    border-radius: 12px;    
    color: white;    
    font-weight: 500;    
    transform: translateX(400px);    
    transition: all 0.3s;    
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);    
}    

.toast.show {    
    transform: translateX(0);    
}    

.toast.success { background: var(--success); color: black; }    
.toast.error { background: var(--error); }    
.toast.info { background: var(--accent); }    

/* Empty State */    
.empty-state {    
    text-align: center;    
    padding: 80px 20px;    
}    

.empty-state-icon {    
    font-size: 4rem;    
    margin-bottom: 20px;    
    opacity: 0.3;    
}    

.empty-state h3 {    
    margin-bottom: 10px;    
    color: var(--text-muted);    
}    

.empty-state p {    
    color: var(--text-muted);    
}    

/* Responsive */    
@media (max-width: 768px) {    
    .games-grid {    
        grid-template-columns: 1fr;    
    }    
        
    .game-detail-header {    
        flex-direction: column;    
        align-items: center;    
        text-align: center;    
    }    
        
    .dlsp-input-group {    
        flex-direction: column;    
    }    
}    

/* Loading Spinner */    
.spinner {    
    width: 20px;    
    height: 20px;    
    border: 2px solid transparent;    
    border-top-color: currentColor;    
    border-radius: 50%;    
    animation: spin 0.8s linear infinite;    
}    

@keyframes spin {    
    to { transform: rotate(360deg); }    
}    

/* Section */    
.section {    
    display: none;    
}    

.section.active {    
    display: block;    
}    

/* Language Switcher */    
.lang-switcher {    
    position: fixed;    
    top: 20px;    
    right: 20px;    
    z-index: 100;    
    display: flex;    
    gap: 10px;    
}    

.lang-btn {    
    padding: 8px 16px;    
    background: var(--bg-card);    
    border: 1px solid var(--border);    
    border-radius: 20px;    
    color: var(--text-muted);    
    cursor: pointer;    
    font-size: 0.85rem;    
    transition: all 0.2s;    
}    

.lang-btn.active {    
    background: var(--primary);    
    color: white;    
    border-color: var(--primary);    
}    

/* Stats Bar */    
.stats-bar {    
    display: flex;    
    justify-content: center;    
    gap: 40px;    
    margin-bottom: 30px;    
    flex-wrap: wrap;    
}    

.stat-item {    
    text-align: center;    
}    

.stat-value {    
    font-size: 2rem;    
    font-weight: 700;    
    color: var(--accent);    
}    


.stat-label {
color: var(--text-muted);
font-size: 0.9rem;
}
</style>

</head>    
<body>    
    <!-- Language Switcher -->    
    <div class="lang-switcher">    
        <button class="lang-btn active" onclick="setLanguage('pt')">PT</button>    
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>    
    </div>  <!-- Menu Toggle -->    
<button class="menu-toggle" onclick="toggleMenu()">☰</button>    <!-- Overlay -->    <div class="overlay" onclick="toggleMenu()"></div>    <!-- Sidebar -->    <nav class="sidebar">    
    <div class="sidebar-header">    
        <h1>🎮 PS4 Library</h1>    
        <p data-i18n="subtitle">Gerenciador de Jogos</p>    
    </div>    
    <div class="sidebar-menu">    
        <div class="menu-item active" onclick="showSection('library')">    
            <i>📚</i>    
            <span data-i18n="menu_library">Biblioteca</span>    
        </div>    
        <div class="menu-item" onclick="showSection('import')">    
            <i>📥</i>    
            <span data-i18n="menu_import">Importar JSON</span>    
        </div>    
    </div>    
</nav>    <!-- Main Content -->    <main class="main-content">    
    <!-- Library Section -->    
    <section id="library-section" class="section active">    
        <div class="header">    
            <h2 data-i18n="library_title">Sua Biblioteca</h2>    
        </div>    <div class="stats-bar" id="stats-bar">    
        <div class="stat-item">    
            <div class="stat-value" id="total-games">0</div>    
            <div class="stat-label" data-i18n="stat_games">Jogos</div>    
        </div>    
        <div class="stat-item">    
            <div class="stat-value" id="total-dlcs">0</div>    
            <div class="stat-label" data-i18n="stat_dlcs">DLCs</div>    
        </div>    
        <div class="stat-item">    
            <div class="stat-value" id="total-updates">0</div>    
            <div class="stat-label" data-i18n="stat_updates">Updates</div>    
        </div>    
    </div>    

    <div class="search-container">    
        <span class="search-icon">🔍</span>    
        <input type="text" class="search-input" id="search-input"     
               placeholder="Buscar jogos..." data-i18n-placeholder="search_placeholder">    
        <div class="search-stats" id="search-stats"></div>    
    </div>    

    <div id="games-container">    
        <div class="empty-state">    
            <div class="empty-state-icon">📦</div>    
            <h3 data-i18n="empty_title">Nenhum jogo encontrado</h3>    
            <p data-i18n="empty_desc">Importe seus arquivos JSON para começar</p>    
        </div>    
    </div>    
</section>    

<!-- Import Section -->    
<section id="import-section" class="section">    
    <div class="header">    
        <h2 data-i18n="import_title">Importar JSON</h2>    
    </div>    

    <div class="import-section">    
        <div class="drop-zone" id="drop-zone">    
            <h3>📁 <span data-i18n="drop_title">Arraste arquivos JSON aqui</span></h3>    
                        <p data-i18n="drop_desc">ou clique para selecionar</p>
            <button class="btn-primary" onclick="document.getElementById('file-input').click()">
                <span>📂</span>
                <span data-i18n="btn_select">Selecionar Arquivos</span>
            </button>

            <input
                type="file"
                id="file-input"
                class="file-input"
                accept=".json"
                multiple
                onchange="handleFileSelect(event)"
            >
        </div>

        <div class="imported-files" id="imported-files"></div>
    </div>
</section>
</main>

<!-- Game Detail Modal -->
<div class="modal" id="game-modal">
    <div class="modal-content">

        <div class="modal-header">
            <h3 data-i18n="modal_title">Detalhes do Jogo</h3>

            <button
                class="close-btn"
                onclick="closeModal()"
                aria-label="Fechar"
            >
                ✕
            </button>
        </div>

        <div class="modal-body" id="modal-body">
            <!-- Conteúdo inserido pelo JavaScript -->
        </div>

    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
    // ==================== STATE MANAGEMENT ====================

    const AppState = {

    function formatSize(bytes) {

        if (!bytes || isNaN(bytes)) {
            return 'N/A';
        }

        if (bytes === 0) {
            return '0 B';
        }

        const k = 1024;

        const sizes = [
            'B',
            'KB',
            'MB',
            'GB',
            'TB'
        ];

        const i =
            Math.floor(Math.log(bytes) / Math.log(k));

        return (
            parseFloat(
                (bytes / Math.pow(k, i)).toFixed(2)
            ) +
            ' ' +
            sizes[i]
        );
    }

        return map[region] || '';
    }


    // ==================== GAME MANAGEMENT ====================

    function compareVersions(v1, v2) {

        const parts1 =
            String(v1 || '0')
                .split('.')
                .map(Number);

        const parts2 =
            String(v2 || '0')
                .split('.')
                .map(Number);

        for (
            let i = 0;
            i < Math.max(parts1.length, parts2.length);
            i++
        ) {

            const p1 = parts1[i] || 0;
            const p2 = parts2[i] || 0;

            if (p1 > p2) return 1;
            if (p1 < p2) return -1;
        }

        return 0;
    }


    function processGameData(data, sourceUrl) {

        const games = new Map();

        Object.entries(data || {}).forEach(([url, info]) => {

            if (!info || !info.title_id) {
                return;
            }

            const gameId = info.title_id;

            const version =
                info.version || '01.00';

            const name =
                info.name || gameId;

            if (!games.has(gameId)) {

                games.set(gameId, {

                    title_id: gameId,

                    name: name,

                    region:
                        info.region || '',

                    cover_url:
                        info.cover_url || '',

                    dlsp_url:
                        info.dlsp_url || '',

                    base: null,

                    updates: [],

                    dlcs: []
                });
            }

            const game =
                games.get(gameId);

            const entry = {
                ...info,
                url,
                source: sourceUrl
            };

            const lowerName =
                name.toLowerCase();

            const isDLC =
                lowerName.includes('dlc') ||
                lowerName.includes('season pass') ||
                lowerName.includes('expansion');

            if (
                version === '01.00' &&
                !isDLC
            ) {

                if (
                    !game.base ||
                    compareVersions(
                        version,
                        game.base.version
                    ) > 0
                ) {

                    game.base = entry;
                }

            } else if (isDLC) {

                game.dlcs.push(entry);

            } else {

                game.updates.push(entry);
            }
        });

        games.forEach(game => {

            game.updates.sort(
                (a, b) =>
                    compareVersions(
                        b.version,
                        a.version
                    )
            );

            game.dlcs.sort(
                (a, b) =>
                    compareVersions(
                        b.version,
                        a.version
                    )
            );
        });

        return games;
    }


    function normalizeGame(game) {

        if (!game || !game.title_id) {
            return null;
        }

        return {
            title_id: String(game.title_id).trim(),
            name: game.name || game.title || game.title_id,
            region: game.region || '',
            cover_url: game.cover_url || game.cover || '',
            dlsp_url: game.dlsp_url || '',
            base: game.base || null,
            updates: Array.isArray(game.updates) ? game.updates : [],
            dlcs: Array.isArray(game.dlcs) ? game.dlcs : []
        };
    }


    function mergeGames(existing, incoming) {

        incoming.forEach((incomingGame, id) => {

            const game = normalizeGame(incomingGame);

            if (!game) {
                return;
            }

            if (!existing.has(id)) {

                existing.set(id, {
                    ...game,
                    updates: [...game.updates],
                    dlcs: [...game.dlcs]
                });

                return;
            }

            const current = existing.get(id);

            if (game.name && (!current.name || current.name === id)) {
                current.name = game.name;
            }

            if (game.region && !current.region) {
                current.region = game.region;
            }

            if (game.cover_url && !current.cover_url) {
                current.cover_url = game.cover_url;
            }

            if (game.dlsp_url && !current.dlsp_url) {
                current.dlsp_url = game.dlsp_url;
            }

            const existingUrls = new Set([
                ...(current.updates || []).map(item => item?.url),
                ...(current.dlcs || []).map(item => item?.url),
                current.base?.url
            ].filter(Boolean));

            for (const update of game.updates || []) {
                if (update?.url && !existingUrls.has(update.url)) {
                    current.updates.push(update);
                    existingUrls.add(update.url);
                }
            }

            for (const dlc of game.dlcs || []) {
                if (dlc?.url && !existingUrls.has(dlc.url)) {
                    current.dlcs.push(dlc);
                    existingUrls.add(dlc.url);
                }
            }

            if (
                game.base &&
                (!current.base || compareVersions(game.base.version, current.base.version) > 0)
            ) {
                current.base = game.base;
            }

            current.updates.sort((a, b) => compareVersions(b.version, a.version));
            current.dlcs.sort((a, b) => compareVersions(b.version, a.version));
        });
    }


    function catalogArrayToMap(data) {

        const rawGames =
            Array.isArray(data)
                ? data
                : (Array.isArray(data?.games) ? data.games : []);

        const games = new Map();

        rawGames.forEach(game => {
            const normalized = normalizeGame(game);
            if (normalized) {
                games.set(normalized.title_id, normalized);
            }
        });

        return games;
    }


    function applyCatalog(data, saveCache = true) {

        const catalogGames = catalogArrayToMap(data);

        mergeGames(AppState.games, catalogGames);

        if (saveCache) {
            try {
                localStorage.setItem(
                    'ps4-library-catalog-cache-v1',
                    JSON.stringify({
                        savedAt: Date.now(),
                        data
                    })
                );
            } catch (error) {
                console.warn('Não foi possível salvar o cache do catálogo:', error);
            }
        }

        updateLibrary();
        return catalogGames.size;
    }


    // ==================== CATALOG ====================

    async function loadCatalog() {

        try {

            const response =
                await fetch('./catalog.json', {
                    cache: 'no-cache'
                });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            const count = applyCatalog(data, true);

            console.info(`Catálogo carregado: ${count} jogo(s).`);

        } catch (error) {

            console.error('Erro ao carregar catálogo:', error);

            let restored = false;

            try {
                const cached = localStorage.getItem('ps4-library-catalog-cache-v1');

                if (cached) {
                    const parsed = JSON.parse(cached);

                    if (parsed?.data) {
                        const count = applyCatalog(parsed.data, false);
                        restored = count > 0;
                        console.warn(`Catálogo restaurado do cache: ${count} jogo(s).`);
                    }
                }
            } catch (cacheError) {
                console.warn('Cache do catálogo inválido:', cacheError);
            }

            if (!restored) {
                showToast(
                    i18n[AppState.currentLang].catalog_error,
                    'error'
                );
                updateLibrary();
            }
        }
    }


    // ==================== FILE HANDLING ====================

    function handleFileSelect(event) {

        const files =
            Array.from(
                event.target.files || []
            );

        processFiles(files);

        event.target.value = '';
    }


    function processFiles(files) {

        const jsonFiles =
            files.filter(file =>
                file.name
                    .toLowerCase()
                    .endsWith('.json')
            );

        if (jsonFiles.length === 0) {

            showToast(
                i18n[AppState.currentLang].error_format,
                'error'
            );

            return;
        }

        let processed = 0;

        jsonFiles.forEach(file => {

            const reader =
                new FileReader();

            reader.onload = event => {

                try {

                    const data =
                        JSON.parse(
                            event.target.result
                        );

                    const sourceData =
                        data.DATA || data;

                    const games =
                        processGameData(
                            sourceData,
                            file.name
                        );

                    mergeGames(
                        AppState.games,
                        games
                    );

                    processed++;

                    addFileToList(
                        file,
                        games.size
                    );

                    if (
                        processed ===
                        jsonFiles.length
                    ) {

                        updateLibrary();

                        showToast(
                            `${AppState.games.size} ${
                                i18n[
                                    AppState.currentLang
                                ].games_found
                            }`,
                            'success'
                        );
                    }

                } catch (error) {

                    console.error(
                        `Erro ao processar ${file.name}:`,
                        error
                    );

                    processed++;

                    showToast(
                        `${file.name}: ${
                            i18n[
                                AppState.currentLang
                            ].error_format
                        }`,
                        'error'
                    );

                    if (
                        processed ===
                        jsonFiles.length
                    ) {
                        updateLibrary();
                    }
                }
            };

            reader.onerror = () => {

                processed++;

                showToast(
                    `${file.name}: ${
                        i18n[
                            AppState.currentLang
                        ].error_format
                    }`,
                    'error'
                );

                if (
                    processed ===
                    jsonFiles.length
                ) {
                    updateLibrary();
                }
            };

            reader.readAsText(file);
        });
    }

    function escapeHtml(value) {

        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // ==================== LIBRARY DISPLAY ====================

    function updateLibrary() {

        const container =
            document.getElementById('games-container');

        // Atualiza estatísticas mesmo quando a biblioteca está vazia
        let dlcs = 0;
        let updates = 0;

        AppState.games.forEach(game => {
            dlcs += (game.dlcs || []).length;
            updates += (game.updates || []).length;
        });

        document.getElementById('total-games').textContent =
            AppState.games.size;

        document.getElementById('total-dlcs').textContent =
            dlcs;

        document.getElementById('total-updates').textContent =
            updates;

        if (AppState.games.size === 0) {

            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📦</div>

                    <h3>
                        ${i18n[
                            AppState.currentLang
                        ].empty_title}
                    </h3>

                    <p>
                        ${i18n[
                            AppState.currentLang
                        ].empty_desc}
                    </p>
                </div>
            `;

            AppState.fuse = null;

            return;
        }

        // Cria/atualiza o mecanismo de busca
        const gameArray =
            Array.from(
                AppState.games.values()
            );

        AppState.fuse =
            new Fuse(
                gameArray,
                {
                    keys: [
                        'name',
                        'title_id'
                    ],

                    threshold: 0.3,

                    includeScore: true
                }
            );

        renderGames(gameArray);
    }

            </h3>

            <div class="version-tree">

                ${
                    treeHTML ||
                    `<p style="color: var(--text-muted);">
                        ${lang.no_files}
                    </p>`
                }

            </div>
        `;

        modal.classList.add('active');
    }


    function createTreeItem(
        item,

    ) {

        const lang =

        const region =

                    <div class="tree-title">

                        <span class="tree-type ${type}">

                        <span>
                            ${escapeHtml(version)}
                        </span>

                    </div>

                </div>

                <div class="tree-meta">

                    <span>
                        📦 ${escapeHtml(size)}
                    </span>

                    <span>
                        🌍 ${escapeHtml(region)}
                    </span>

                    <span>
                        🔒 FW ${escapeHtml(firmware)}
                    </span>

                </div>

                ${
                    url
                        ? `

                                <a
                                    class="btn-small btn-download"
                                    href="${escapeHtml(url)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    🔗 Abrir Link
                                </a>

                                <a
                                    href="${escapeHtml(url)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="btn-small btn-download"

    function closeModal() {

        document
            .getElementById('game-modal')
            .classList.remove('active');
    }

    // ==================== DLSP INTEGRATION ====================

    async function resolveDLSP(titleId, gameName) {

        const input =
            document.getElementById('dlsp-url');

        const status =
            document.getElementById('dlsp-status');

        const results =
            document.getElementById('dlsp-results');

        const lang =
            i18n[AppState.currentLang];

        const url =
            input?.value.trim();

        if (!url) {

            showToast(
                'Informe a URL do DLSP Game.',
                'error'
            );

            return;
        }

        try {

            const parsedUrl =
                new URL(url);

            if (
                !/^dlpsgame\.com$/i.test(
                    parsedUrl.hostname
                ) &&
                !/\.dlpsgame\.com$/i.test(
                    parsedUrl.hostname
                )
            ) {

                throw new Error(
                    'A URL precisa ser do DLSP Game.'
                );
            }

        } catch (error) {

            showToast(
                'URL inválida. Use um link do DLSP Game.',
                'error'
            );

            return;
        }

        status.className =
            'dlsp-status loading active';

        status.innerHTML = `
            <span
                class="spinner"
                style="
                    display: inline-block;
                    vertical-align: middle;
                    margin-right: 8px;
                "
            ></span>

            ${lang.dlsp_loading}
        `;

        results.innerHTML = '';

        try {

            const response =
                await fetch(
                    '/api/resolve',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({ url, titleId, gameName })
                    }
                );

            let data;

            try {
                data =
                    await response.json();
            } catch {
                throw new Error(
                    `Resposta inválida do servidor (${response.status}).`
                );
            }

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    `Erro HTTP ${response.status}`
                );
            }

            status.className =
                'dlsp-status success active';

            status.textContent =
                lang.dlsp_success;

            renderDLSPResults(
                data.links || {}
            );

        } catch (error) {

            console.error(
                'Erro ao resolver DLSP:',
                error
            );

            status.className = 
'dlsp-status error active';

        status.textContent =
            error.message ||
            lang.dlsp_error;
        }
    }

    function renderDLSPResults(links) {

        const results =
            document.getElementById('dlsp-results');

        if (!results) {
            return;
        }

        const groups = [
            {
                key: 'base',
                label: 'Jogo Base',
                type: 'base'
            },
            {
                key: 'updates',
                label: 'Updates',
                type: 'update'
            },
            {
                key: 'dlcs',
                label: 'DLCs',
                type: 'dlc'
            }
        ];

        let html = '';

        groups.forEach(group => {

            const items =
                Array.isArray(links[group.key])
                    ? links[group.key]
                    : [];

            if (items.length === 0) {
                return;
            }

            html += `
                <div
                    style="
                        margin-top: 15px;
                        margin-bottom: 10px;
                        font-weight: 600;
                    "
                >
                    ${group.label}
                </div>
            `;

            items.forEach(item => {

                const resolved =
                    item.resolved;

                const directUrl =
                    resolved?.success &&
                    resolved.url
                        ? resolved.url
                        : null;

                const originalUrl =
                    item.originalUrl || '';

                const displayUrl =
                    directUrl || originalUrl;

                html += `
                    <div class="tree-item ${group.type}">

                        <div class="tree-header">
                            <div class="tree-title">

                                <span
                                    class="tree-type ${group.type}"
                                >
                                    ${group.label}
                                </span>

                                <span>
                                    ${escapeHtml(
                                        item.text ||
                                        'Link encontrado'
                                    )}
                                </span>

                            </div>
                        </div>

                        <div class="tree-meta">

                            ${
                                resolved?.host
                                    ? `
                                        <span>
                                            🌐 ${escapeHtml(
                                                resolved.host
                                            )}
                                        </span>
                                    `
                                    : ''
                            }

                            <span>
                                ${
                                    directUrl
                                        ? '✅ Resolvido'
                                        : (resolved?.error
                                            ? `❌ ${escapeHtml(resolved.error)}`
                                            : '🔗 Link encontrado')
                                }
                            </span>

                        </div>

                        <div class="tree-actions">

                            <a
                                class="btn-small btn-download"
                                href="${escapeHtml(displayUrl)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                🔗 Abrir Link
                            </a>

                            ${
                                displayUrl
                                    ? `
                                        <a
                                            href="${escapeHtml(displayUrl)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            class="btn-small btn-download"
                                            style="text-decoration:none;"
                                        >
                                            🔗 Abrir
                                        </a>
                                    `
                                    : ''
                            }

                        </div>

                    </div>
                `;
            });
        });

        if (!html) {

            html = `
                <div
                    style="
                        padding: 15px;
                        color: var(--text-muted);
                        background: rgba(255,255,255,0.02);
                        border-radius: 8px;
                    "
                >
                    Nenhum link foi encontrado nessa página.
                </div>
            `;
        }

        results.innerHTML = html;
    }


    // ==================== UTILITIES ====================

    async function copyToClipboard(text) {

        if (!text) {
            showToast(
                'Nenhum link disponível para copiar.',
                'error'
            );
            return;
        }

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                throw new Error('Clipboard API indisponível');
            }

            showToast(
                i18n[
                    AppState.currentLang
                ].copied,
                'success'
            );
            return;

        } catch (error) {
            console.warn(
                'Clipboard API falhou, tentando fallback:',
                error
            );
        }

        try {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '-9999px';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);

            const copied = document.execCommand('copy');
            document.body.removeChild(textarea);

            if (!copied) {
                throw new Error('Fallback de cópia falhou');
            }

            showToast(
                i18n[
                    AppState.currentLang
                ].copied,
                'success'
            );

        } catch (error) {
            console.error(
                'Erro ao copiar:',
                error
            );

            showToast(
                'Não foi possível copiar o link.',
                'error'
            );
        }
    }


    // ==================== SEARCH ====================

    document
        .getElementById('search-input')
        .addEventListener(
            'input',
            event => {

                const query =
                    event.target.value.trim();

                const stats =
                    document.getElementById(
                        'search-stats'
                    );

                if (!query) {

                    updateLibrary();

                    stats.textContent = '';

                    return;
                }

                if (!AppState.fuse) {

                    stats.textContent =
                        '0 resultado(s)';

                    return;
                }

                const searchResults =
                    AppState.fuse.search(query);

                renderGames(
                    searchResults.map(
                        result => result.item
                    )
                );

                stats.textContent =
                    `${searchResults.length} resultado(s)`;
            }
        );


    // ==================== DRAG AND DROP ====================

    const dropZone =
        document.getElementById('drop-zone');

    dropZone.addEventListener(
        'dragover',
        event => {

            event.preventDefault();

            dropZone.classList.add(
                'dragover'
            );
        }
    );

    dropZone.addEventListener(
        'dragleave',
        () => {

            dropZone.classList.remove(
                'dragover'
            );
        }
    );

    dropZone.addEventListener(
        'drop',
        event => {

            event.preventDefault();

            dropZone.classList.remove(
                'dragover'
            );

            processFiles(
                Array.from(
                    event.dataTransfer.files || []
                )
            );
        }
    );


    // ==================== MODAL ====================

    document
        .getElementById('game-modal')
        .addEventListener(
            'click',
            event => {

                if (
                    event.target.id ===
                    'game-modal'
                ) {
                    closeModal();
                }
            }
        );


    // ==================== KEYBOARD ====================

    document.addEventListener(
        'keydown',
        event => {

            if (event.key === 'Escape') {
                closeModal();
            }

            if (
                event.key.toLowerCase() === 'm' &&
                event.ctrlKey
            ) {

                event.preventDefault();

                toggleMenu();
            }
        }
    );


    // ==================== INITIALIZATION ====================

    setLanguage('pt');

    loadCatalog();

</script>
